<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6dcc6">
<title>От войны к войне. Европа между мировыми войнами на карте</title>
<meta name="description" content="Интерактивная карта Европы 1914–1939: политика, экономика и общество между мировыми войнами.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Rubik+Mono+One&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans+Narrow:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-years">1914<span>—</span>1939</div>
    <div>
      <h1>От войны к войне</h1>
      <p>Европа между мировыми войнами<span class="wide">: политика, деньги, общество</span></p>
    </div>
  </div>
  <nav class="top-btns">
    <button type="button" id="btnLeaders" class="ghost">Лидеры</button>
    <button type="button" id="btnAbout" class="ghost">О карте</button>
  </nav>
</header>
<div class="wall" id="wall" aria-hidden="true"></div>

<main class="layout">
  <section class="map-col">
    <div class="map-wrap" id="mapWrap">
      <svg id="map" role="img" aria-label="Карта Европы"></svg>
      <div class="map-year" id="mapYear"></div>
      <div class="zoom">
        <button type="button" id="zIn" aria-label="Приблизить">+</button>
        <button type="button" id="zOut" aria-label="Отдалить">−</button>
        <button type="button" id="zReset" aria-label="Показать всю карту">⤢</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="pop" id="pop" hidden>
        <button type="button" class="pop-x" id="popX" aria-label="Закрыть">×</button>
        <div class="pop-t" id="popT"></div>
        <div class="pop-d" id="popD"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="panel">
    <div class="step-head">
      <div class="step-date" id="stepDate"></div>
      <h2 id="stepTitle"></h2>
      <p class="step-note" id="stepNote" hidden></p>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="politics" class="on">Политика</button>
      <button type="button" role="tab" data-tab="society">Общество и экономика</button>
      <button type="button" role="tab" data-tab="analysis">Анализ</button>
    </div>
    <div class="tab-body" id="tabBody"></div>

    <h3 class="sub">На карте</h3>
    <ol class="marks" id="marks"></ol>

    <h3 class="sub" id="leadersTitle">Лидеры</h3>
    <div class="leaders" id="leaders"></div>

    <div class="question">
      <div class="q-label">Вопрос для обсуждения</div>
      <p id="question"></p>
    </div>
  </section>
</main>

<footer class="timeline">
  <button type="button" class="nav" id="prev" aria-label="Предыдущий шаг">‹</button>
  <div class="chips" id="chips" role="tablist" aria-label="Шкала годов"></div>
  <button type="button" class="nav" id="next" aria-label="Следующий шаг">›</button>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button type="button" class="modal-x" id="modalX" aria-label="Закрыть">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="map-data.js"></script>
<script src="names.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
